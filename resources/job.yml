# Job mensal: extrai o CAGED novo e, se chegou dado, atualiza o pipeline.
resources:
  jobs:
    observatorio_mensal:
      name: observatorio-mensal
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 7 ? * Mon"   # toda segunda, 07:00
        timezone_id: America/Fortaleza
      email_notifications:
        on_failure:
          - ${var.email_alerta}
      tasks:
        - task_key: extrair_caged
          notebook_task:
            notebook_path: ../src/extracao/caged_mensal.py
            base_parameters:
              destino: /Volumes/${var.catalogo_landing}/landing/raw/caged
              catalogo: ${var.catalogo_landing}

        - task_key: tem_dado_novo
          depends_on:
            - task_key: extrair_caged
          condition_task:
            left: "{{tasks.extrair_caged.values.novas_competencias}}"
            op: GREATER_THAN
            right: "0"

        - task_key: atualizar_pipeline
          depends_on:
            - task_key: tem_dado_novo
              outcome: "true"
          pipeline_task:
            pipeline_id: ${resources.pipelines.observatorio_pipeline.id}
